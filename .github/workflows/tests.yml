name: bulksms-api-tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      testrail_driven:
        description: "Run the TestRail-driven pipeline (reads cases from TestRail, creates a run, reports results) instead of a plain mvn test"
        type: boolean
        default: false

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile test sources
        run: mvn -B test-compile

  integration-test:
    name: Run against a live bulksms-api
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: r00t
          MYSQL_DATABASE: sms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pr00t"
          --health-interval=10s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout bulksms-api-tests
        uses: actions/checkout@v4
        with:
          path: bulksms-api-tests

      - name: Checkout bulksms-api
        uses: actions/checkout@v4
        with:
          repository: YOUR_GH_ORG/bulksms-api
          path: bulksms-api
          token: ${{ secrets.BULKSMS_API_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: bulksms-api-tests/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bulksms-api/requirements.txt

      - name: Load bulksms-api schema
        run: mysql -h127.0.0.1 -uroot -pr00t sms < bulksms-api/schema.sql

      - name: Install bulksms-api
        working-directory: bulksms-api
        run: |
          pip install -r requirements.txt
          cp .env.example .env

      - name: Seed bootstrap admin
        working-directory: bulksms-api
        run: python seed_admin.py

      - name: Start bulksms-api
        working-directory: bulksms-api
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "bulksms-api did not become healthy in time"; cat uvicorn.log; exit 1

      - name: Run tests (mvn test)
        if: ${{ github.event.inputs.testrail_driven != 'true' }}
        working-directory: bulksms-api-tests
        env:

          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_RUN_ID: ${{ secrets.TESTRAIL_RUN_ID }}
        run: mvn -B test -Dcucumber.filter.tags="not @ignore"

      - name: Run tests (TestRail-driven pipeline)
        if: ${{ github.event.inputs.testrail_driven == 'true' }}
        working-directory: bulksms-api-tests
        env:
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_SUITE_ID: ${{ secrets.TESTRAIL_SUITE_ID }}
        run: mvn -B test-compile exec:java -Dexec.mainClass=bulksmsapi.testrail.TestRailDrivenRunner

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            bulksms-api-tests/target/logs/**
            bulksms-api-tests/target/cucumber-html-report/**
            bulksms-api-tests/target/cucumber.json
            bulksms-api-tests/target/surefire-reports/**
            bulksms-api/uvicorn.log
          if-no-files-found: warn
          retention-days: 14
